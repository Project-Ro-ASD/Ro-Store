name: Bug report
description: Uygulamadaki hatalari raporlamak icin kullanin.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Ozet
      description: Hatayi kisaca tarif edin.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama adimlari
      description: Hatayi tekrar etmek icin gerekli adimlari yazin.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen sonuc
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Gerceklesen sonuc
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ortam
      description: Ornek: Fedora 41 / Qt 6.7
