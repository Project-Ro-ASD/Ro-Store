name: Build Fedora 44 RPMs

on:
  push:
    branches:
      - main
      - "feature/stable-release-v1.0"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpm:
    name: Fedora 44 RPM - ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    container:
      image: fedora:44

    steps:
      - name: Install Git for source checkout
        run: dnf -y install git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install \
            cmake \
            ninja-build \
            gcc-c++ \
            python3 \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            kf6-kirigami \
            rpm-build \
            rpmlint \
            desktop-file-utils \
            appstream \
            appstream-qt-devel

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n -E \
            's/^[[:space:]]*VERSION[[:space:]]+([0-9.]+).*/\1/p' \
            CMakeLists.txt | head -n1)"

          test -n "$VERSION"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$ ]]
            [[ "${GITHUB_REF_NAME%-rc*}" == "v${VERSION}" ]]
          fi

      - name: Flatpak safety source regression checks
        run: python3 -m unittest discover -s tests/flatpak -p 'test_*.py' -v

      - name: Configure
        shell: bash
        run: |
          RPM_RELEASE=1
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc([1-9][0-9]*)$ ]]; then
            RPM_RELEASE="0.rc${BASH_REMATCH[1]}"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DRO_STORE_RPM_RELEASE="$RPM_RELEASE"

      - name: Build
        run: cmake --build build --parallel

      - name: Flatpak backend integration tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate desktop metadata
        run: |
          desktop-file-validate \
            build/org.projectro.RoStore.desktop

          appstreamcli validate --no-net \
            build/org.projectro.RoStore.metainfo.xml

      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n -E \
            's/^[[:space:]]*VERSION[[:space:]]+([0-9.]+).*/\1/p' \
            CMakeLists.txt | head -n1)"
          test -n "$version"
          rpm_release=1
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc([1-9][0-9]*)$ ]]; then
            rpm_release="0.rc${BASH_REMATCH[1]}"
          fi
          topdir="$RUNNER_TEMP/ro-store-rpmbuild"
          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git -c safe.directory="$GITHUB_WORKSPACE" archive \
            --format=tar.gz --prefix="ro-store-${version}/" \
            --output="$topdir/SOURCES/ro-store-${version}.tar.gz" "$GITHUB_SHA"
          cp packaging/rpm/ro-store.spec "$topdir/SPECS/ro-store.spec"
          rpmbuild -ba "$topdir/SPECS/ro-store.spec" \
            --define "_topdir $topdir" \
            --define "dist .fc44" \
            --define "ro_release $rpm_release"
          mkdir -p packages
          cp "$topdir/RPMS/${{ matrix.arch }}"/*.rpm packages/
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then
            cp "$topdir/SRPMS"/*.src.rpm packages/
          fi

      - name: Verify RPM
        shell: bash
        run: |
          set -euo pipefail

          RPM_FILE="$(find packages -maxdepth 1 -type f -name '*.${{ matrix.arch }}.rpm' -print -quit)"

          test -n "$RPM_FILE"

          VERSION="$(sed -n -E \
            's/^[[:space:]]*VERSION[[:space:]]+([0-9.]+).*/\1/p' \
            CMakeLists.txt | head -n1)"

          test -n "$VERSION"
          test "$(rpm -qp --qf '%{NAME}' "$RPM_FILE")" = "ro-store"
          test "$(rpm -qp --qf '%{VERSION}' "$RPM_FILE")" = "$VERSION"
          EXPECTED_RELEASE=1.fc44
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc([1-9][0-9]*)$ ]]; then
            EXPECTED_RELEASE="0.rc${BASH_REMATCH[1]}.fc44"
          fi
          test "$(rpm -qp --qf '%{RELEASE}' "$RPM_FILE")" = "$EXPECTED_RELEASE"
          test "$(rpm -qp --qf '%{ARCH}' "$RPM_FILE")" = "${{ matrix.arch }}"
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then
            source_rpm="$(find packages -maxdepth 1 -type f -name '*.src.rpm' -print -quit)"
            test -n "$source_rpm"
            test "$(rpm -qp --qf '%{SOURCERPM}' "$RPM_FILE")" = "$(basename "$source_rpm")"
            test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$source_rpm")" = \
              "$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$RPM_FILE")"
          fi

          rpm -qpl "$RPM_FILE" | grep -Fx '/usr/bin/ro-store'
          rpm -qpl "$RPM_FILE" | grep -Fx '/usr/share/applications/org.projectro.RoStore.desktop'
          rpm -qpl "$RPM_FILE" | grep -Fx '/usr/share/metainfo/org.projectro.RoStore.metainfo.xml'

      - name: Lint RPM
        run: rpmlint packages/*.rpm

      - name: Install RPM
        shell: bash
        run: |
          set -euo pipefail

          RPM_FILE="$(find packages -maxdepth 1 -type f -name '*.${{ matrix.arch }}.rpm' -print -quit)"

          dnf -y install --nogpgcheck --allowerasing "$RPM_FILE"

          rpm -q ro-store
          command -v ro-store
          ldd /usr/bin/ro-store

      - name: QML startup smoke test
        shell: bash
        run: |
          set -euo pipefail

          for scenario in home installed history unified updates; do
            ARGS=()
            if [ "$scenario" = installed ]; then
              ARGS=(--qa-open-installed)
            elif [ "$scenario" = history ]; then
              ARGS=(--qa-open-history)
            elif [ "$scenario" = unified ]; then
              ARGS=(--qa-open-unified)
            elif [ "$scenario" = updates ]; then
              ARGS=(--qa-open-system-updates)
            fi

            set +e
            QT_QPA_PLATFORM=offscreen timeout 4s /usr/bin/ro-store "${ARGS[@]}" \
              > /tmp/ro-store.log 2>&1
            STATUS=$?
            set -e

            cat /tmp/ro-store.log

            if grep -Ei \
              'failed to load component|contains no type named|module .* is not installed' \
              /tmp/ro-store.log; then
                exit 1
            fi

            if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
                exit "$STATUS"
            fi
          done

      - name: Collect RPM
        shell: bash
        run: |
          mkdir -p release-assets

          cp packages/*.rpm release-assets/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ro-store-${{ matrix.arch }}
          path: release-assets/*.rpm
          if-no-files-found: error

  producer-contract:
    name: Verify Ro-Repo producer bundle
    needs:
      - build-rpm
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install rpm python3
      - uses: actions/download-artifact@v4
        with:
          pattern: ro-store-*
          path: release-assets
          merge-multiple: true
      - name: Validate exact RPM and source identities
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n -E \
            's/^[[:space:]]*VERSION[[:space:]]+([0-9.]+).*/\1/p' \
            CMakeLists.txt | head -n1)"
          tag="v${version}"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$ ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          python3 scripts/build-component-manifest.py \
            --artifacts-dir release-assets \
            --output release-assets/component-artifact-manifest-v1.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --tag "$tag" \
            --release-id 1 \
            --workflow-run "$GITHUB_RUN_ID"
          python3 -m json.tool release-assets/component-artifact-manifest-v1.json >/dev/null

  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - producer-contract

    runs-on: ubuntu-24.04

    container:
      image: fedora:44

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Install Git for source checkout
        run: dnf -y install git

      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Verify reviewed main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Install release tools
        run: dnf -y install git rpm python3 python3-jsonschema gh jq

      - name: Download RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: ro-store-*
          path: release-assets
          merge-multiple: true

      - name: Verify producer RPM set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq 3
          test "$(find release-assets -maxdepth 1 -type f -name '*.src.rpm' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.x86_64.rpm' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.aarch64.rpm' | wc -l)" -eq 1
          test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.rpm > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create draft GitHub Release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ro-Store ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --draft
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.id')"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Generate Ro-Repo producer manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-component-manifest.py \
            --artifacts-dir release-assets \
            --output release-assets/component-artifact-manifest-v1.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --release-id "${{ steps.draft.outputs.release_id }}" \
            --workflow-run "$GITHUB_RUN_ID"

      - name: Attest producer assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/*.rpm
            release-assets/SHA256SUMS
            release-assets/component-artifact-manifest-v1.json

      - name: Verify producer attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in release-assets/*.rpm release-assets/SHA256SUMS release-assets/component-artifact-manifest-v1.json; do
            verified=false
            for attempt in 1 2 3; do
              if gh attestation verify "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"; then
                verified=true
                break
              fi
              sleep 10
            done
            test "$verified" = true
          done

      - name: Upload exact producer assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/*.rpm \
            release-assets/SHA256SUMS \
            release-assets/component-artifact-manifest-v1.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            args+=(-F prerelease=true)
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false "${args[@]}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '.immutable == true and .draft == false' | grep -Fx true
