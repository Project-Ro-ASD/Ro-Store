name: Build Fedora 44 RPMs

on:
  push:
    branches:
      - main
      - "feature/stable-release-v1.0"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpm:
    name: Fedora 44 RPM - ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    container:
      image: fedora:44

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install \
            cmake \
            ninja-build \
            gcc-c++ \
            python3 \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            kf6-kirigami \
            rpm-build \
            desktop-file-utils \
            appstream \
            appstream-qt-devel

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n -E \
            's/^[[:space:]]*VERSION[[:space:]]+([0-9.]+).*/\1/p' \
            CMakeLists.txt | head -n1)"

          test -n "$VERSION"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$ ]]
            [[ "${GITHUB_REF_NAME%-rc*}" == "v${VERSION}" ]]
          fi

      - name: Flatpak safety source regression checks
        run: python3 -m unittest discover -s tests/flatpak -p 'test_*.py' -v

      - name: Configure
        shell: bash
        run: |
          RPM_RELEASE=1
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc([1-9][0-9]*)$ ]]; then
            RPM_RELEASE="0.rc${BASH_REMATCH[1]}"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DRO_STORE_RPM_RELEASE="$RPM_RELEASE"

      - name: Build
        run: cmake --build build --parallel

      - name: Flatpak backend integration tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate desktop metadata
        run: |
          desktop-file-validate \
            build/org.projectro.RoStore.desktop

          appstreamcli validate --no-net \
            build/org.projectro.RoStore.metainfo.xml

      - name: Build RPM
        run: |
          rm -rf packages

          cpack \
            --config build/CPackConfig.cmake \
            -G RPM \
            -B packages

      - name: Verify RPM
        shell: bash
        run: |
          set -euo pipefail

          RPM_FILE="$(find packages -maxdepth 1 -type f -name '*.rpm' -print -quit)"

          test -n "$RPM_FILE"

          VERSION="$(sed -n -E \
            's/^[[:space:]]*VERSION[[:space:]]+([0-9.]+).*/\1/p' \
            CMakeLists.txt | head -n1)"

          test -n "$VERSION"
          test "$(rpm -qp --qf '%{NAME}' "$RPM_FILE")" = "ro-store"
          test "$(rpm -qp --qf '%{VERSION}' "$RPM_FILE")" = "$VERSION"
          EXPECTED_RELEASE=1.fc44
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc([1-9][0-9]*)$ ]]; then
            EXPECTED_RELEASE="0.rc${BASH_REMATCH[1]}.fc44"
          fi
          test "$(rpm -qp --qf '%{RELEASE}' "$RPM_FILE")" = "$EXPECTED_RELEASE"
          test "$(rpm -qp --qf '%{ARCH}' "$RPM_FILE")" = "${{ matrix.arch }}"

          rpm -qpl "$RPM_FILE" | grep -Fx '/usr/bin/ro-store'
          rpm -qpl "$RPM_FILE" | grep -Fx '/usr/share/applications/org.projectro.RoStore.desktop'
          rpm -qpl "$RPM_FILE" | grep -Fx '/usr/share/metainfo/org.projectro.RoStore.metainfo.xml'

      - name: Install RPM
        shell: bash
        run: |
          set -euo pipefail

          RPM_FILE="$(find packages -maxdepth 1 -type f -name '*.rpm' -print -quit)"

          dnf -y install --nogpgcheck --allowerasing "$RPM_FILE"

          rpm -q ro-store
          command -v ro-store
          ldd /usr/bin/ro-store

      - name: QML startup smoke test
        shell: bash
        run: |
          set -euo pipefail

          for scenario in home installed history unified updates; do
            ARGS=()
            if [ "$scenario" = installed ]; then
              ARGS=(--qa-open-installed)
            elif [ "$scenario" = history ]; then
              ARGS=(--qa-open-history)
            elif [ "$scenario" = unified ]; then
              ARGS=(--qa-open-unified)
            elif [ "$scenario" = updates ]; then
              ARGS=(--qa-open-system-updates)
            fi

            set +e
            QT_QPA_PLATFORM=offscreen timeout 4s /usr/bin/ro-store "${ARGS[@]}" \
              > /tmp/ro-store.log 2>&1
            STATUS=$?
            set -e

            cat /tmp/ro-store.log

            if grep -Ei \
              'failed to load component|contains no type named|module .* is not installed' \
              /tmp/ro-store.log; then
                exit 1
            fi

            if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
                exit "$STATUS"
            fi
          done

      - name: Collect RPM
        shell: bash
        run: |
          mkdir -p release-assets

          RPM_FILE="$(find packages -maxdepth 1 -type f -name '*.rpm' -print -quit)"

          cp "$RPM_FILE" release-assets/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ro-store-${{ matrix.arch }}
          path: release-assets/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-rpm

    runs-on: ubuntu-24.04

    container:
      image: fedora:44

    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Verify reviewed main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Install release tools
        run: dnf -y install rpm-sign gnupg2 gh

      - name: Download RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: ro-store-*
          path: release-assets
          merge-multiple: true

      - name: Sign and verify RPMs
        env:
          RPM_SIGNING_KEY_BASE64: ${{ secrets.RPM_SIGNING_KEY_BASE64 }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RPM_SIGNING_KEY_BASE64"
          test -n "$RPM_SIGNING_PASSPHRASE"
          umask 077
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "$secret_dir"' EXIT
          printf '%s' "$RPM_SIGNING_KEY_BASE64" | base64 --decode > "$secret_dir/key.asc"
          printf '%s' "$RPM_SIGNING_PASSPHRASE" > "$secret_dir/passphrase"
          scripts/sign-release-rpms.sh \
            release-assets \
            packaging/repository/RPM-GPG-KEY-ro-asd \
            "$secret_dir/key.asc" \
            "$secret_dir/passphrase" \
            38CB87F6FBD645309432A6E22E02DEE8828B769B

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.rpm > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          test -s "$NOTES_FILE"

          ARGS=()
          if [[ "$VERSION" == *-rc* ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.rpm \
            release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Ro-Store ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            "${ARGS[@]}"
