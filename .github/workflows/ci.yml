name: Build Fedora 43 RPMs

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    name: Build ${{ matrix.rpm_arch }} RPM
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_platform: linux/amd64
            rpm_arch: x86_64
            build_dir: build-x86_64
          - docker_platform: linux/arm64
            rpm_arch: aarch64
            build_dir: build-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Install Fedora 43 build dependencies
        run: |
          docker run --rm \
            --platform "${{ matrix.docker_platform }}" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                cmake \
                gcc-c++ \
                ninja-build \
                qt6-qtbase-devel \
                qt6-qtdeclarative-devel \
                rpm-build \
                desktop-file-utils
            '

      - name: Configure Fedora 43 build
        run: |
          docker run --rm \
            --platform "${{ matrix.docker_platform }}" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                cmake \
                gcc-c++ \
                ninja-build \
                qt6-qtbase-devel \
                qt6-qtdeclarative-devel

              cmake -S . -B "${{ matrix.build_dir }}" -G Ninja -DCMAKE_BUILD_TYPE=Release
            '

      - name: Build Fedora 43 application
        run: |
          docker run --rm \
            --platform "${{ matrix.docker_platform }}" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                cmake \
                gcc-c++ \
                ninja-build \
                qt6-qtbase-devel \
                qt6-qtdeclarative-devel

              cmake --build "${{ matrix.build_dir }}" --parallel
            '

      - name: Validate desktop entry
        run: |
          docker run --rm \
            --platform "${{ matrix.docker_platform }}" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y desktop-file-utils
              desktop-file-validate "${{ matrix.build_dir }}/org.projectro.RoStore.desktop"
            '

      - name: Lint QML
        run: |
          docker run --rm \
            --platform "${{ matrix.docker_platform }}" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y qt6-qtdeclarative-devel
              qmllint-qt6 \
                -I "${{ matrix.build_dir }}" \
                -I "${{ matrix.build_dir }}/RoStore" \
                "${{ matrix.build_dir }}/RoStore/qml/Main.qml" \
                "${{ matrix.build_dir }}/RoStore/qml/pages/HomePage.qml" \
                "${{ matrix.build_dir }}/RoStore/qml/pages/AppDetailPage.qml" \
                "${{ matrix.build_dir }}/RoStore/qml/components/AppCard.qml"
            '

      - name: Package Fedora 43 RPM
        run: |
          mkdir -p dist
          docker run --rm \
            --platform "${{ matrix.docker_platform }}" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y cmake rpm-build
              cpack --config "${{ matrix.build_dir }}/CPackConfig.cmake" -G RPM

              rpm_file=$(find "${{ matrix.build_dir }}" -maxdepth 1 -type f -name "*.rpm" | head -n 1)
              final_name=$(rpm -qp --qf "%{NAME}-%{VERSION}-%{ARCH}.rpm" "$rpm_file")
              mv "$rpm_file" "dist/$final_name"
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ro-store-${{ matrix.rpm_arch }}-rpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-rpm
    runs-on: ubuntu-latest

    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v5
        with:
          name: ro-store-x86_64-rpm
          path: release-assets

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v5
        with:
          name: ro-store-aarch64-rpm
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.rpm
